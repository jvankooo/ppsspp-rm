; Rumble profile: God of War: Chains of Olympus (USA, UCUS98653)
;
; Put this file in the memory stick's PSP/RUMBLE folder (on the Switch: sdmc:/switch/ppsspp-nx/PSP/RUMBLE/).
; Its presence turns rumble on for this game. Format: docs/rumble.md.
;
; Values from the gowco-sw research (runtime/rt_debug.c), checked in PPSSPP:
;  - the game object: pointer at 0x08B3655C; Kratos at +0x84; his component list at Kratos +0x24 (64 pointers)
;  - health component: the one with vtable 0x08B3E248 (at component +0xC); current health float +0x64, max +0x70
;  - combo counter ("HITS"): the component with vtable 0x08B485EC; count u32 at +0xB8
;  - pause menu: byte 0x08B2DAC3, bit 0x80 while paused

[Profile]
name = God of War: Chains of Olympus
; The game's own state only counts while Kratos is alive and the game isn't paused.
active_when = health > 0, paused == 0
; Sound rumble: big impacts (doors, chests bursting open, heavy landings, cut-scene blows).
sound = on
sound_sensitivity = 5
; No rumble while a movie (FMV) plays.
mute_during_video = on

[Value.health]
address = 0x08B3655C
path = * +0x84 * +0x24 * find(64, 0x0C, 0x08B3E248) +0x64
type = float

[Value.health_max]
address = 0x08B3655C
path = * +0x84 * +0x24 * find(64, 0x0C, 0x08B3E248) +0x70
type = float

[Value.combo]
address = 0x08B3655C
path = * +0x84 * +0x24 * find(64, 0x0C, 0x08B485EC) +0xB8
type = u32

[Value.paused]
address = 0x08B2DAC3
type = u8
mask = 0x80

; Kratos takes a hit: harder and longer for a bigger part of the health bar.
[Rule.hit_taken]
label = Hits taken
value = health
event = drop
relative_to = health_max
min = 0.0005
max = 1.0
strength = 0.35
gain = 2.6
strength_max = 1.0
duration = 200
big = 0.25
big_strength = 1.0
big_duration = 450
feel = heavy

; Kratos lands a blow: the combo counter goes up. A short, crisp tap.
[Rule.hit_landed]
label = Blows landed
value = combo
event = rise
min = 1
max = 99
strength = 0.25
gain = 0.15
strength_max = 0.55
duration = 70
feel = sharp
